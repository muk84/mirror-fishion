<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرآة الأناقة - تنسيق الملابس</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<style>
  :root{color-scheme:dark;
    --bg1:#0b0d14; --bg2:#1a1330; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12);
    --text:#f4f4f8; --muted:#a3a8bd; --accent:#f5b74e; --accent2:#ff6b9d;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; min-height:100%; color:var(--text);
    font-family:"Tahoma","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(900px 500px at 85% -10%,#3b1f6b55,transparent),radial-gradient(700px 400px at -10% 30%,#ff6b9d22,transparent),linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));}
  header{text-align:center; max-width:480px;}
  h1{font-size:1.5rem; margin:4px 0 2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  p.sub{color:var(--muted); font-size:.8rem; margin:0; line-height:1.6;}
  .stage{position:relative; width:100%; max-width:480px; height:calc(min(100vw - 28px,480px)*4/3); flex-shrink:0;
    background:#000; border-radius:24px; overflow:hidden; border:1px solid var(--card-b);
    box-shadow:0 20px 50px -15px #000c, 0 0 0 1px #ffffff08 inset;}
  .flip{position:absolute; inset:0; z-index:1;}
  video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; visibility:hidden;}
  canvas{position:absolute; inset:0; width:100%; height:100%;}
  #overlay{cursor:grab; z-index:2;}
  .guide{position:absolute; inset:7%; border:2px dashed rgba(255,255,255,.3); border-radius:26px; pointer-events:none; z-index:3;}
  .hint{position:absolute; bottom:10px; right:10px; left:10px; text-align:center; font-size:.72rem; color:#fff; background:rgba(10,10,20,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:6px 10px; border-radius:12px; z-index:4;}
  .badge{position:absolute; top:10px; right:10px; font-size:.68rem; background:rgba(10,10,20,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; padding:4px 10px; border-radius:20px; z-index:4;}
  .panel{width:100%; max-width:480px; display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--card); border:1px solid var(--card-b); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:12px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  .card h2{margin:0; font-size:.85rem; color:var(--muted); font-weight:600;}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .btns{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  button,.filebtn{font-family:inherit; border:none; border-radius:14px; padding:12px 10px; font-weight:700; cursor:pointer; font-size:.82rem; color:var(--text);
    background:rgba(255,255,255,.09); border:1px solid var(--card-b); text-align:center; transition:transform .12s, background .2s;}
  button:active,.filebtn:active{transform:scale(.96);}
  button.primary{grid-column:1/-1; color:#2a1a02; border:none; font-size:.95rem; padding:14px;
    background:linear-gradient(90deg,var(--accent),#ffd27a); box-shadow:0 8px 24px -8px #f5b74e99;}
  .swatches{display:flex; gap:8px; flex-wrap:wrap; flex:1;}
  .sw{width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.25); cursor:pointer; transition:transform .15s;}
  .sw.selected{border-color:#fff; transform:scale(1.18);}
  input[type=color]{width:42px; height:42px; border:2px solid var(--card-b); border-radius:12px; background:none; padding:2px; cursor:pointer;}
  input[type=file]{display:none;}
  .filebtn{padding:8px 12px; font-size:.75rem; display:inline-block;}
  .small{padding:8px 12px; font-size:.75rem;}
  .harmony{display:flex; gap:10px; flex-wrap:wrap;}
  .h-item{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:.68rem; color:var(--muted); cursor:pointer;}
  .h-chip{width:44px; height:44px; border-radius:14px; border:2px solid var(--card-b); transition:transform .15s;}
  .h-item:active .h-chip{transform:scale(.9);}
  #status{font-size:.75rem; color:var(--muted); text-align:center; min-height:16px;}
  .ver{font-size:.62rem; color:#6b7090; text-align:center;}
  .colorbtn{display:flex; align-items:center; gap:10px; flex:1; justify-content:flex-start;}
  .dot{width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,.5); display:inline-block;}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .25s; z-index:90;}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(310px,84vw); z-index:100; transform:translateX(105%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1); background:rgba(20,16,38,.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-left:1px solid var(--card-b); padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;}
  body.drawer-open .drawer{transform:none;}
  body.drawer-open .scrim{opacity:1; pointer-events:auto;}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; font-weight:700;}
  .swgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
  .swgrid .sw{width:100%; aspect-ratio:1; height:auto; border-radius:14px;}
  .custom{display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--muted);}
  .lbl{font-size:.75rem; color:var(--muted); margin-bottom:-6px;}
  .fam{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  .fam .sw{width:100%; aspect-ratio:1; height:auto; border-radius:50%;}
  .fam .sw.selected{transform:scale(1.12); box-shadow:0 0 0 3px rgba(255,255,255,.35);}
  a#dl{display:none;}
</style>
</head>
<body>
<header>
  <h1>👗 مرآة الأناقة</h1>
  <p class="sub">جرّب الملابس مباشرة على الكاميرا، وبدّل ألوانها وانسّقها بذكاء.</p>
</header>

<div class="stage" id="stage">
  <div class="flip" id="flipWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="guide" id="guide"></div>
  <div class="badge" id="modeBadge">وضع: --</div>
  <div class="hint" id="hintText">اضغط "تشغيل الكاميرا" للبدء</div>
</div>

<div class="panel">
  <div class="card">
    <div class="btns">
      <button id="startBtn" class="primary">📷 تشغيل الكاميرا</button>
      <button id="camBtn">🤳 أمامية / خلفية</button>
      <button id="modeBtn">🔄 تلقائي / يدوي</button>
      <button id="snapBtn">📸 حفظ صورة</button>
      <button id="stopBtn">⏹ إيقاف</button>
      <div class="row" style="grid-column:1/-1; justify-content:center;">
        <label style="font-size:.8rem; color:var(--muted);">طولك (سم)</label>
        <input type="number" id="heightInput" placeholder="170" min="100" max="220" style="width:70px; padding:8px; border-radius:10px; border:1px solid var(--card-b); background:rgba(255,255,255,.08); color:var(--text); text-align:center;">
      </div>
      <button id="calibBtn" class="primary" style="grid-column:1/-1;">📏 معايرة القياس (قف كاملاً في الإطار)</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>👕 القطعة العلوية</h2>
    <div class="row"><button class="colorbtn" data-target="top"><span class="dot" id="topDot"></span> اختر لون القميص</button></div>
    <div class="row">
      <label class="filebtn" for="topImgInput">📁 رفع صورة قميص</label>
      <input type="file" accept="image/*" id="topImgInput">
      <button id="topImgClear" class="small">إزالة</button>
    </div>
  </div>

  <div class="card">
    <h2>👖 القطعة السفلية</h2>
    <div class="row"><button class="colorbtn" data-target="bottom"><span class="dot" id="bottomDot"></span> اختر لون البنطال</button></div>
    <div class="row">
      <label class="filebtn" for="bottomImgInput">📁 رفع صورة بنطال</label>
      <input type="file" accept="image/*" id="bottomImgInput">
      <button id="bottomImgClear" class="small">إزالة</button>
    </div>
  </div>

  <div class="card">
    <h2>🎨 اقتراحات تنسيق الألوان (اضغط لتطبيقها على السفلية)</h2>
    <div class="harmony" id="harmony"></div>
  </div>
</div>

<a id="dl" download="outfit-preview.png"></a>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><span id="drawerTitle">🎨 الألوان</span><button class="small" id="drawerClose">✕ إغلاق</button></div>
  <div class="lbl">اللون الأساسي</div>
  <div class="fam" id="famRow"></div>
  <div class="lbl">التدرجات (من الفاتح إلى الداكن)</div>
  <div class="swgrid" id="drawerSw"></div>
  <div class="custom"><span>لون مخصص:</span>
    <input type="color" id="topColor" value="#3b5b8c">
    <input type="color" id="bottomColor" value="#22262e" style="display:none">
  </div>
</aside>

<div class="ver">إصدار 13</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const modeBadge = document.getElementById('modeBadge');
const hintText = document.getElementById('hintText');
const families=[[0,72],[24,85],[45,90],[58,85],[88,65],[140,60],[172,65],[195,80],[215,75],[245,65],[275,60],[330,75],[0,0]]; // [hue,sat] والأخير رمادي
const lights=[93,82,70,58,47,37,28,19,11];
const famHex=i=>hslToHex(families[i][0],families[i][1],families[i][1]?50:50);
let drawerTarget='top', famIdx=8;
function refreshDots(){
  ['top','bottom'].forEach(k=>{ document.getElementById(k+'Dot').style.background=document.getElementById(k+'Color').value; });
}
function nearestFamily(hex){
  const [h,sat]=hexToHsl(hex);
  if(sat<12) return families.length-1;
  let best=0,bd=999;
  for(let i=0;i<families.length-1;i++){ const d=Math.min(Math.abs(families[i][0]-h),360-Math.abs(families[i][0]-h)); if(d<bd){bd=d;best=i;} }
  return best;
}
function renderShades(){
  const c=document.getElementById('drawerSw'); c.innerHTML='';
  const cur=document.getElementById(drawerTarget+'Color').value.toLowerCase();
  const [h,sat]=families[famIdx];
  lights.forEach(l=>{
    const hex=hslToHex(h,sat,l);
    const d=document.createElement('div');
    d.className='sw'+(hex===cur?' selected':''); d.style.background=hex;
    d.onclick=()=>{
      const inp=document.getElementById(drawerTarget+'Color');
      inp.value=hex; inp.dispatchEvent(new Event('input'));
      c.querySelectorAll('.sw').forEach(x=>x.classList.toggle('selected',x===d));
    };
    c.appendChild(d);
  });
  document.querySelectorAll('#famRow .sw').forEach((x,i)=>x.classList.toggle('selected',i===famIdx));
}
function openDrawer(which){
  drawerTarget=which;
  document.getElementById('drawerTitle').textContent = which==='top' ? '🎨 لون القطعة العلوية' : '🎨 لون القطعة السفلية';
  document.getElementById('topColor').style.display = which==='top' ? '' : 'none';
  document.getElementById('bottomColor').style.display = which==='bottom' ? '' : 'none';
  famIdx=nearestFamily(document.getElementById(which+'Color').value);
  renderShades();
  document.body.classList.add('drawer-open');
}
function closeDrawer(){ document.body.classList.remove('drawer-open'); }
(function buildDrawer(){
  const fr=document.getElementById('famRow');
  families.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='sw'; d.style.background=f[1]?hslToHex(f[0],f[1],50):'#808080';
    d.onclick=()=>{ famIdx=i; renderShades(); };
    fr.appendChild(d);
  });
  document.querySelectorAll('.colorbtn').forEach(b=>b.onclick=()=>openDrawer(b.dataset.target));
  document.getElementById('scrim').onclick=closeDrawer;
  document.getElementById('drawerClose').onclick=closeDrawer;
  ['topColor','bottomColor'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{refreshDots(); if(document.body.classList.contains('drawer-open')) renderShades();}));
  refreshDots();
})();

/* ---------- manual fallback boxes ---------- */
function makeBox(x,y,w,h,color){ return {x,y,w,h,color}; }
let boxes = {
  top: makeBox(0.28,0.30,0.44,0.28,document.getElementById('topColor').value),
  bottom: makeBox(0.30,0.58,0.40,0.32,document.getElementById('bottomColor').value)
};

function resizeCanvas(){
  overlay.width = overlay.clientWidth;
  overlay.height = overlay.clientHeight;
}
function setStageSize(){
  const stage = document.getElementById('stage');
  let h = Math.round(stage.clientWidth * 4/3);
  if(!h || h < 50) h = 480;
  stage.style.height = h + 'px';
  resizeCanvas();
}
window.addEventListener('resize', setStageSize);
setStageSize();

function rrPath(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
}
function drawGarment(center, angle, w, h, tintedImg, color){
  ctx.save();
  ctx.translate(center.x, center.y);
  ctx.rotate(angle);
  if(tintedImg){
    ctx.globalAlpha = 0.92;
    ctx.drawImage(tintedImg, -w/2, -h/2, w, h);
    ctx.globalAlpha = 1;
  } else {
    rrPath(-w/2,-h/2,w,h, Math.min(w,h)*0.14);
    ctx.fillStyle = color; ctx.globalAlpha = 0.6; ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.restore();
}

/* ---------- uploaded clothing images ---------- */
let topImgRaw=null, topTinted=null, bottomImgRaw=null, bottomTinted=null;
function retint(which){
  const img = which==='top' ? topImgRaw : bottomImgRaw;
  if(!img) return;
  const color = document.getElementById(which+'Color').value;
  const off = document.createElement('canvas');
  off.width = img.naturalWidth; off.height = img.naturalHeight;
  const octx = off.getContext('2d');
  octx.drawImage(img,0,0);
  octx.globalCompositeOperation='color';
  octx.fillStyle = color;
  octx.fillRect(0,0,off.width,off.height);
  octx.globalCompositeOperation='destination-in';
  octx.drawImage(img,0,0);
  if(which==='top') topTinted=off; else bottomTinted=off;
}
function loadClothingImage(file, which){
  const img = new Image();
  img.onload = ()=>{
    if(which==='top') topImgRaw=img; else bottomImgRaw=img;
    retint(which);
    statusEl.textContent='تم إضافة صورة الملابس — يمكنك الآن تغيير لونها من منتقي الألوان.';
  };
  img.src = URL.createObjectURL(file);
}
document.getElementById('topImgInput').addEventListener('change', e=>{ if(e.target.files[0]) loadClothingImage(e.target.files[0],'top'); });
document.getElementById('bottomImgInput').addEventListener('change', e=>{ if(e.target.files[0]) loadClothingImage(e.target.files[0],'bottom'); });
document.getElementById('topImgClear').onclick = ()=>{ topImgRaw=null; topTinted=null; document.getElementById('topImgInput').value=''; };
document.getElementById('bottomImgClear').onclick = ()=>{ bottomImgRaw=null; bottomTinted=null; document.getElementById('bottomImgInput').value=''; };

function drawManual(){
  Object.entries(boxes).forEach(([key,b])=>{
    const x=b.x*overlay.width, y=b.y*overlay.height, w=b.w*overlay.width, h=b.h*overlay.height;
    const tinted = key==='top' ? topTinted : bottomTinted;
    if(tinted){
      ctx.globalAlpha=0.92;
      ctx.drawImage(tinted, x, y, w, h);
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle=b.color; ctx.globalAlpha=0.55;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x,y,w,h,16) : ctx.rect(x,y,w,h);
      ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
  });
}

let active=null, mode='move', start=null;
function pos(e){
  const r = overlay.getBoundingClientRect();
  const cx = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
  const cy = (e.touches?e.touches[0].clientY:e.clientY) - r.top;
  let fx = cx/overlay.width;
  if(currentFacing==='user') fx = 1 - fx;
  return {x:fx, y:cy/overlay.height};
}
function hit(p){
  for(const key of ['bottom','top']){
    const b=boxes[key];
    if(p.x>b.x && p.x<b.x+b.w && p.y>b.y && p.y<b.y+b.h) return key;
  }
  return null;
}
function down(e){
  if(usePose) return;
  const p=pos(e); const key=hit(p);
  if(key){ active=key; start={p, b:{...boxes[key]}}; mode = e.shiftKey?'resize':'move'; }
}
function move(e){
  if(!active || usePose) return;
  e.preventDefault();
  const p=pos(e); const b=boxes[active], s=start;
  if(mode==='move'){
    b.x = Math.min(Math.max(s.b.x + (p.x-s.p.x),0), 1-b.w);
    b.y = Math.min(Math.max(s.b.y + (p.y-s.p.y),0), 1-b.h);
  } else {
    b.w = Math.min(Math.max(s.b.w + (p.x-s.p.x), 0.1), 0.9-b.x);
    b.h = Math.min(Math.max(s.b.h + (p.y-s.p.y), 0.1), 0.9-b.y);
  }
}
function up(){ active=null; }
overlay.addEventListener('mousedown',down);
overlay.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
overlay.addEventListener('touchstart',down,{passive:true});
overlay.addEventListener('touchmove',move,{passive:false});
overlay.addEventListener('touchend',up);

/* ---------- pose detection (automatic) ---------- */
let detector=null, usePose=false, poseFailed=false;
let smooth={};
function smoothPt(name, p){
  if(!p) return smooth[name];
  const prev = smooth[name];
  const s = prev ? {x: prev.x*0.72+p.x*0.28, y: prev.y*0.72+p.y*0.28} : p;
  smooth[name]=s;
  return s;
}

/* ---------- calibration: lock stable body-proportion ratios ---------- */
let calib=null, calibrating=false, calibSamples=[];
function median(arr){ const a=[...arr].sort((x,y)=>x-y); return a[Math.floor(a.length/2)]; }
document.getElementById('calibBtn').onclick = ()=>{
  if(!usePose || !detector){ statusEl.textContent='شغّل الكاميرا وانتظر تفعيل الوضع التلقائي أولاً.'; return; }
  calibrating = true; calibSamples = [];
  guide.style.display='block';
  hintText.textContent='قف باستقامة وجسمك كاملاً داخل الإطار المتقطع، ثابتًا لثانيتين...';
};
function tryCalibrate(ls,rs,lh,rh,legEndMid){
  if(!calibrating) return;
  if(!(ls&&rs&&lh&&rh)) return;
  const shoulderW = Math.hypot(rs.x-ls.x, rs.y-ls.y);
  const hipW = Math.hypot(rh.x-lh.x, rh.y-lh.y);
  if(shoulderW<10) return;
  calibSamples.push({shoulderW, hipW});
  if(calibSamples.length>=36){
    const sw = median(calibSamples.map(s=>s.shoulderW));
    const hw = median(calibSamples.map(s=>s.hipW));
    const heightCm = parseFloat(document.getElementById('heightInput').value) || 170;
    calib = {
      heightCm,
      pxPerCm: sw / (heightCm*0.259),   // shoulder width ≈ 25.9% من الطول
      shirtWRatio: 1.55,
      pantsWRatio: (hw*1.6)/sw
    };
    calibrating=false; guide.style.display='none';
    hintText.textContent='تمت المعايرة ✅ — القميص والبنطال بمقاس ثابت متناسب مع طولك';
    statusEl.textContent='تمت المعايرة بنجاح.';
  }
}
async function initPose(){
  try{
    hintText.textContent='جارٍ تحميل نموذج الكشف التلقائي عن الجسم...';
    await tf.setBackend('webgl'); await tf.ready();
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}
    );
    usePose = true;
    modeBadge.textContent='وضع: تلقائي';
    hintText.textContent='قف بحيث يظهر جسمك بالكامل تقريبًا في الإطار';
  }catch(e){
    usePose = false; poseFailed = true;
    modeBadge.textContent='وضع: يدوي';
    hintText.textContent='تعذر تحميل الكشف التلقائي — اسحب المربعات يدويًا';
    statusEl.textContent='تعذر تحميل نموذج الكشف التلقائي، تم التفعيل التلقائي للوضع اليدوي.';
  }
}

function kp(keypoints, name){
  const p = keypoints.find(k=>k.name===name);
  if(!p || p.score<0.3) return null;
  return {x:p.x, y:p.y};
}

let latestPoses=[], detecting=false, lastDetect=0, loopsStarted=false;
async function detectTick(){
  if(usePose && detector && video.readyState>=2 && !detecting && performance.now()-lastDetect>45){
    detecting=true;
    try{ latestPoses = await detector.estimatePoses(video,{flipHorizontal:false}); }catch(e){}
    lastDetect=performance.now(); detecting=false;
  }
  setTimeout(detectTick, 16);
}

function drawVideoFrame(){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw || !vh) return;
  const scale = Math.max(overlay.width/vw, overlay.height/vh);
  const dw=vw*scale, dh=vh*scale;
  ctx.drawImage(video, (overlay.width-dw)/2, (overlay.height-dh)/2, dw, dh);
}

function poseLoop(){
  if(video.readyState>=2 && overlay.width>0){
    ctx.save();
    ctx.clearRect(0,0,overlay.width,overlay.height);
    const mirror = currentFacing==='user';
    if(mirror){ ctx.translate(overlay.width,0); ctx.scale(-1,1); }
    drawVideoFrame();
    if(usePose && detector){
      try{
        const poses = latestPoses;
        if(poses[0]){
          const vw=video.videoWidth, vh=video.videoHeight;
          const sc=Math.max(overlay.width/vw, overlay.height/vh);
          const ox=(overlay.width-vw*sc)/2, oy=(overlay.height-vh*sc)/2;
          const raw = {};
          ['left_shoulder','right_shoulder','left_hip','right_hip','left_knee','right_knee','left_ankle','right_ankle']
            .forEach(n=>{ const p=kp(poses[0].keypoints,n); raw[n]= p? {x:p.x*sc+ox, y:p.y*sc+oy} : null; });
          const ls=smoothPt('ls',raw.left_shoulder), rs=smoothPt('rs',raw.right_shoulder);
          const lh=smoothPt('lh',raw.left_hip), rh=smoothPt('rh',raw.right_hip);
          const lk=smoothPt('lk',raw.left_knee), rk=smoothPt('rk',raw.right_knee);
          const la=smoothPt('la',raw.left_ankle), ra=smoothPt('ra',raw.right_ankle);
          const hipMid = (lh&&rh) ? {x:(lh.x+rh.x)/2, y:(lh.y+rh.y)/2} : null;
          const leftEnd = la || lk, rightEnd = ra || rk;
          const legEndMid = (leftEnd&&rightEnd) ? {x:(leftEnd.x+rightEnd.x)/2,y:(leftEnd.y+rightEnd.y)/2}
                            : (leftEnd||rightEnd||null);
          tryCalibrate(ls,rs,lh,rh,legEndMid);

          // زاوية ومحور نزول واحد مشترك بين القميص والبنطال، لضمان تلاقيهما عند خط الوركين بدقة بدون تداخل أو فراغ
          let bodyAngle = 0;
          if(ls&&rs&&lh&&rh){
            const sv={x:rs.x-ls.x,y:rs.y-ls.y}, hv={x:rh.x-lh.x,y:rh.y-lh.y};
            bodyAngle = Math.atan2(sv.y+hv.y, sv.x+hv.x);
          } else if(lh&&rh){
            bodyAngle = Math.atan2(rh.y-lh.y, rh.x-lh.x);
          } else if(ls&&rs){
            bodyAngle = Math.atan2(rs.y-ls.y, rs.x-ls.x);
          }
          const down = {x:-Math.sin(bodyAngle), y:Math.cos(bodyAngle)};
          const heightCm = calib ? calib.heightCm : (parseFloat(document.getElementById('heightInput').value)||170);

          if(ls && rs && lh && rh){
            const liveShoulderW = Math.hypot(rs.x-ls.x, rs.y-ls.y);
            const w = liveShoulderW * (calib?calib.shirtWRatio:1.55);
            const h2 = calib ? calib.pxPerCm*heightCm*0.36
                             : Math.hypot(hipMid.x-((ls.x+rs.x)/2), hipMid.y-((ls.y+rs.y)/2))*1.3;
            const center = {x: hipMid.x-down.x*(h2*0.5), y: hipMid.y-down.y*(h2*0.5)};
            drawGarment(center, bodyAngle, w, h2, topTinted, document.getElementById('topColor').value);
          }
          if(lh && rh){
            const liveShoulderW2 = (ls&&rs) ? Math.hypot(rs.x-ls.x, rs.y-ls.y) : Math.hypot(rh.x-lh.x,rh.y-lh.y)/0.85;
            const w = liveShoulderW2 * (calib?calib.pantsWRatio:(Math.hypot(rh.x-lh.x,rh.y-lh.y)*1.6/liveShoulderW2));
            const h2 = calib ? calib.pxPerCm*heightCm*0.50
                             : (legEndMid?Math.hypot(legEndMid.x-hipMid.x,legEndMid.y-hipMid.y)*1.15:liveShoulderW2*1.6);
            const center = {x: hipMid.x+down.x*(h2*0.5), y: hipMid.y+down.y*(h2*0.5)};
            drawGarment(center, bodyAngle, w, h2, bottomTinted, document.getElementById('bottomColor').value);
          }
        }
      }catch(e){ /* skip frame on error */ }
    } else {
      drawManual();
    }
    ctx.restore();
  }
  requestAnimationFrame(poseLoop);
}

document.getElementById('modeBtn').onclick = ()=>{
  if(poseFailed && !detector){ statusEl.textContent='الكشف التلقائي غير متاح على هذا الجهاز.'; return; }
  usePose = !usePose;
  modeBadge.textContent = usePose ? 'وضع: تلقائي' : 'وضع: يدوي';
  hintText.textContent = usePose ? 'قف بحيث يظهر جسمك بالكامل تقريبًا في الإطار' : 'اسحب المربعات لتناسب جسمك';
};

/* ---------- camera ---------- */
const flipWrap = document.getElementById('flipWrap');
const guide = document.getElementById('guide');
let currentFacing = 'user';
let currentStream = null;

async function openCamera(facing){
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
  statusEl.textContent='جارِ طلب إذن الكاميرا...';
  const constraints = {
    audio:false,
    video:{
      facingMode: {ideal: facing},
      width:{ideal:720}, height:{ideal:1280},
      aspectRatio:{ideal:0.75},
      frameRate:{ideal:30}
    }
  };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  currentStream = stream;
  currentFacing = facing;
  video.srcObject = stream;
  await new Promise(res=>{ video.onloadedmetadata = res; });
  setStageSize();
  statusEl.textContent='الكاميرا تعمل — قف بحيث يظهر جسمك كاملاً داخل الإطار المتقطع.';
}

document.getElementById('startBtn').onclick = async ()=>{
  try{
    await openCamera(currentFacing);
    guide.style.display = detector ? 'none' : 'block';
    if(!detector) await initPose(); else { usePose=true; modeBadge.textContent='وضع: تلقائي'; }
    guide.style.display='none';
    if(!loopsStarted){ loopsStarted=true; poseLoop(); detectTick(); }
  }catch(err){
    statusEl.textContent='تعذر الوصول إلى الكاميرا. تأكد من منح الإذن من إعدادات المتصفح، ومن استخدام رابط https.';
  }
};

document.getElementById('camBtn').onclick = async ()=>{
  if(!currentStream){ statusEl.textContent='شغّل الكاميرا أولاً.'; return; }
  try{
    await openCamera(currentFacing==='user' ? 'environment' : 'user');
  }catch(e){
    statusEl.textContent='تعذر تبديل الكاميرا على هذا الجهاز.';
  }
};

document.getElementById('stopBtn').onclick = ()=>{
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; }
  video.srcObject = null;
  usePose = false; detector = null; poseFailed = false; smooth = {};
  ctx.clearRect(0,0,overlay.width,overlay.height);
  modeBadge.textContent = 'وضع: --';
  hintText.textContent = 'اضغط "تشغيل الكاميرا" للبدء';
  statusEl.textContent = 'تم إيقاف الكاميرا.';
};

function handleOrientation(){ setTimeout(setStageSize, 250); }
window.addEventListener('orientationchange', handleOrientation);
if(screen.orientation) screen.orientation.addEventListener('change', handleOrientation);

/* ---------- snapshot ---------- */
document.getElementById('snapBtn').onclick = ()=>{
  if(!video.srcObject){ statusEl.textContent='شغّل الكاميرا أولاً.'; return; }
  const dl = document.getElementById('dl');
  dl.href = overlay.toDataURL('image/png');
  dl.click();
  statusEl.textContent='تم حفظ الصورة.';
};

/* ---------- color harmony ---------- */
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}
  else{
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d + (g<b?6:0); break;
      case g: h=(b-r)/d + 2; break;
      case b: h=(r-g)/d + 4; break;
    }
    h/=6;
  }
  return [h*360,s*100,l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+toHex(r)+toHex(g)+toHex(b);
}
function updateHarmony(){
  const base = document.getElementById('topColor').value;
  const [h,s,l] = hexToHsl(base);
  const combos = [
    {name:'مكمل', h:(h+180)%360},
    {name:'ثلاثي 1', h:(h+120)%360},
    {name:'ثلاثي 2', h:(h+240)%360},
    {name:'متجانس 1', h:(h+30)%360},
    {name:'متجانس 2', h:(h-30+360)%360},
  ];
  const box = document.getElementById('harmony');
  box.innerHTML='';
  combos.forEach(c=>{
    const hex = hslToHex(c.h, Math.max(s,40), Math.min(Math.max(l,35),70));
    const item = document.createElement('div');
    item.className='h-item';
    item.innerHTML = `<div class="h-chip" style="background:${hex}"></div><span>${c.name}</span>`;
    item.onclick = ()=>{ const bc=document.getElementById('bottomColor'); bc.value=hex; bc.dispatchEvent(new Event('input')); };
    box.appendChild(item);
  });
}
document.getElementById('topColor').addEventListener('input', e=>{
  boxes.top.color = e.target.value;
  retint('top');
  updateHarmony();
});
document.getElementById('bottomColor').addEventListener('input', e=>{
  boxes.bottom.color = e.target.value;
  retint('bottom');
});
updateHarmony();
</script>
